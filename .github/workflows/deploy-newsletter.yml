name: Deploy Newsletter Clikdata Drops

on:
  # Disparo manual pelo GitHub UI ou via API
  workflow_dispatch:
    inputs:
      edicao:
        description: 'Arquivo da edição (ex: edicoes/ed-001-2026-05-06.html)'
        required: true
        type: string
      assunto:
        description: 'Assunto do e-mail (ex: Clikdata Drops #01 — 06/05/2026)'
        required: true
        type: string
      nome_campanha:
        description: 'Nome interno da campanha no Brevo'
        required: true
        type: string
      lista_brevo:
        description: 'ID da lista Brevo (padrão: 6)'
        required: false
        default: '6'
        type: string
      apenas_criar:
        description: 'Apenas criar campanha no Brevo, sem disparar'
        required: false
        default: 'false'
        type: boolean

  # Disparo automático ao fazer push de nova edição
  push:
    branches:
      - main
    paths:
      - 'edicoes/**.html'

jobs:
  deploy:
    name: Push + Brevo
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Detectar arquivo de edição ─────────────────────────────
      - name: Detectar edição alterada
        id: detectar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARQUIVO="${{ github.event.inputs.edicao }}"
          else
            # Push automático: pega o último HTML adicionado/modificado em edicoes/
            ARQUIVO=$(git diff --name-only HEAD~1 HEAD -- 'edicoes/*.html' | tail -1)
          fi

          if [ -z "$ARQUIVO" ] || [ ! -f "$ARQUIVO" ]; then
            echo "❌ Arquivo de edição não encontrado: $ARQUIVO"
            exit 1
          fi

          echo "arquivo=$ARQUIVO" >> $GITHUB_OUTPUT

          # Derivar assunto e nome da campanha quando disparado via push
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE=$(basename "$ARQUIVO" .html)           # ed-001-2026-05-06
            NUM=$(echo "$BASE" | grep -oP '(?<=ed-)\d+')
            DATA=$(echo "$BASE" | grep -oP '\d{4}-\d{2}-\d{2}')
            DATA_PT=$(date -d "$DATA" '+%d/%m/%Y' 2>/dev/null || echo "$DATA")
            ASSUNTO="Clikdata Drops #${NUM} — ${DATA_PT}"
            NOME="Clikdata Drops #${NUM} — ${DATA_PT}"
          else
            ASSUNTO="${{ github.event.inputs.assunto }}"
            NOME="${{ github.event.inputs.nome_campanha }}"
          fi

          echo "assunto=$ASSUNTO"       >> $GITHUB_OUTPUT
          echo "nome_campanha=$NOME"    >> $GITHUB_OUTPUT
          echo "✅ Edição detectada: $ARQUIVO"

      # ── 3. Criar campanha no Brevo ────────────────────────────────
      - name: Criar campanha Brevo
        id: brevo_criar
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          ARQUIVO="${{ steps.detectar.outputs.arquivo }}"
          ASSUNTO="${{ steps.detectar.outputs.assunto }}"
          NOME="${{ steps.detectar.outputs.nome_campanha }}"
          LISTA_ID="${{ github.event.inputs.lista_brevo || '6' }}"

          HTML=$(cat "$ARQUIVO")

          PAYLOAD=$(python3 -c "
          import json, sys
          html = open('$ARQUIVO').read()
          print(json.dumps({
              'name': '$NOME',
              'subject': '$ASSUNTO',
              'sender': {'name': 'Clikdata Drops', 'email': 'drops@clikdata.com.br'},
              'type': 'classic',
              'htmlContent': html,
              'recipients': {'listIds': [$LISTA_ID]}
          }))
          ")

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.brevo.com/v3/emailCampaigns" \
            -H "api-key: $BREVO_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Erro ao criar campanha: HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          CAMPAIGN_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "campaign_id=$CAMPAIGN_ID" >> $GITHUB_OUTPUT
          echo "✅ Campanha criada: ID $CAMPAIGN_ID"

      # ── 4. Disparar campanha ──────────────────────────────────────
      - name: Disparar campanha Brevo
        if: ${{ github.event.inputs.apenas_criar != 'true' }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          CAMPAIGN_ID="${{ steps.brevo_criar.outputs.campaign_id }}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.brevo.com/v3/emailCampaigns/${CAMPAIGN_ID}/sendNow" \
            -H "api-key: $BREVO_API_KEY")

          if [ "$HTTP_CODE" != "204" ]; then
            echo "❌ Erro ao disparar campanha: HTTP $HTTP_CODE"
            exit 1
          fi

          echo "🚀 Campanha $CAMPAIGN_ID disparada com sucesso!"

      # ── 5. Resumo no Job Summary ──────────────────────────────────
      - name: Resumo
        if: always()
        run: |
          echo "## 📧 Clikdata Drops — Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Arquivo | \`${{ steps.detectar.outputs.arquivo }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Campanha Brevo | \`${{ steps.brevo_criar.outputs.campaign_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Assunto | ${{ steps.detectar.outputs.assunto }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Disparada | ${{ github.event.inputs.apenas_criar != 'true' && '✅ Sim' || '⏸ Não (apenas criada)' }} |" >> $GITHUB_STEP_SUMMARY
